<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transfer save · Storybook Kingdom</title><style>body{max-width:750px;margin:50px auto;padding:25px;background:#faf4e8;color:#382d33;font:19px/1.6 system-ui}button,a,input{font:inherit}button,a{padding:12px 18px;display:inline-block;margin:10px 0;background:#4a6652;color:white;border:0;border-radius:8px}label{display:block;margin:20px 0}#status{padding:15px;background:#eee2cd}</style><h1>Storybook Kingdom · Save transfer</h1><p>On your old site, export your browser save. Then open this page at the new Wonderworld address and restore that file. Use the same browser profile where you played.</p><button id="export">Export this browser’s save</button><label>Restore a save file<input id="restore" type="file" accept=".json"></label><p id="status" role="status">Only this world’s progress is included. Other Wonderworld progress is kept.</p><a href="./">Open the world</a><script>
const app="storybook-kingdom",prefixes=["sk_", "storybook", "roseglass"],allowed=k=>prefixes.some(p=>k.startsWith(p)),message=t=>document.querySelector('#status').textContent=t;
document.querySelector('#export').onclick=()=>{try{const data={};Object.keys(localStorage).filter(allowed).forEach(k=>data[k]=localStorage.getItem(k));if(!Object.keys(data).length){message('No saved progress for this world was found in this browser at this address.');return}const u=URL.createObjectURL(new Blob([JSON.stringify({app,version:1,data},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=app+'-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);message('Save exported. Keep the file, then restore it at the new address.')}catch{message('Browser storage is unavailable.')}};
document.querySelector('#restore').onchange=async e=>{try{const f=e.target.files[0];if(!f||f.size>10000000)throw Error();const s=JSON.parse(await f.text());if(s.app!==app||s.version!==1||!s.data||typeof s.data!=='object'||Array.isArray(s.data))throw Error();const entries=Object.entries(s.data);if(entries.some(([k,v])=>!allowed(k)||typeof v!=='string'))throw Error();if(!confirm('Replace matching saved progress for this world in this browser?'))return;const before={};entries.forEach(([k])=>before[k]=localStorage.getItem(k));try{entries.forEach(([k,v])=>localStorage.setItem(k,v))}catch(error){Object.entries(before).forEach(([k,v])=>v===null?localStorage.removeItem(k):localStorage.setItem(k,v));throw error}message('Save restored. Open the world to continue.')}catch{message('Restore failed. Choose the save exported for this world; current progress was kept.')}};
</script></html>
